# Netlify Configuration for SecureCloud
# Reference: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory containing the static website assets to deploy
  publish = "securecloud/frontend"

# Production security and optimization headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static style and script assets
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Direct portfolio link handling
[[redirects]]
  from = "/portfolio"
  to = "/portfolio/index.html"
  status = 200

# Optional Reverse Proxy for Backend:
# If you deploy your FastAPI backend to a service like Render, Railway, or AWS,
# you can route API calls through Netlify by uncommenting this block:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.onrender.com/:splat"
#   status = 200
#   force = true
